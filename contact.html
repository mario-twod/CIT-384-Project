<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href= "images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/aboutMeStyle.css">
    <title>Contact Me</title>
</head>

<body>

        <header class="main-header" id="main-header">
            <div class="socialIcons">
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-linkedin"></i>
                <i class="fa-brands fa-twitter"></i>
            </div>

            <div class="logo">
                <img src="./images/Portofolio Logo.jpg" 
                alt="logo"
                width="125"
                height="125"
                title="Mario Aguilar"
                usemap>
                <map name="logomap">
                    <area 
                    shape="rect" 
                    coords="0,0,125,125" 
                    href="index.html" 
                    alt="logo">
                </map>    
            </div>

            <h1 class="websitename">Mario Aguilar</h1>
        </header>

            <nav class= "navBarContainer">
                <div class="tabs">
                    <ul>
                        <li><a href="index.html" title="Go to Home" class="homeTab">Home</a></li>   
                        <li><a href="contact.html" title="Different Contact Methods" class="contactTab">Contact</a></li>
                        <li><a href="aboutme.html" title="About Mario Aguilar" class="aboutTab">About</a></li>    
                    </ul>   
                </div>
            </nav>    

        
        <main>
            
            <div class="email">
                <h2>Email</h2>
                <a href="mailto:mario.aguilar.270@my.csun.edu">Send Email Here</a>
            </div>
            <form>
                <h2>Contact Form</h2>
                <div>
                    <label for="name">First Name:</label>
                    <input 
                    type="text" 
                    id="name" 
                    placeholder="Enter First Name"
                    name="first-name"
                    minlength="3"
                    maxlength="10"
                    required
                    autofocus
                    />
                </div>
                
                <div>
                    <label for="name">Last Name:</label>
                    <input 
                    type="text" 
                    id="name" 
                    placeholder="Enter Last Name"
                    name="last-name"
                    minlength="3"
                    maxlength="10"
                    required/>
                </div>
                
                <div>
                    <label for="number">Phone Number:</label>
                    <input 
                    type="number" 
                    id="number" 
                    placeholder="xxx-xxx-xxxx"
                    name="phone-number"
                    required/>
                </div>
                
                <div>
                    <label for="email">Email Address:</label>
                    <input 
                    type="email" 
                    id="email" 
                    placeholder="example@example.com"
                    name="email"
                    required/>
                </div>
                
                <div>
                    <label for="text">Subject:</label>
                    <input 
                    type="text" 
                    id="name" 
                    placeholder="ex. Job Opportunity"
                    name="subject"
                    minlength="3"
                    maxlength="25"
                    required/>
                </div>
                
                <div>
                    <label for="message">Message:</label>
                    <textarea 
                    id="message" 
                    name="message"
                    placeholder="Type Message"
                    rows="4"
                    cols="40"
                    required>
                    </textarea>
                </div>
                
                <div>
                    <label for="range">Priority of Message:</label>
                    <input 
                    type="range" 
                    name="priority" 
                    id="priority"
                    list="priorityTicks"
                    min="0"
                    max="2">
                    <datalist id="priorityTicks">
                        <option value="0"></option>
                        <option value="1"></option>
                        <option value="2"></option>
                    </datalist>
                </div>
                <button type="submit">Submit</button>
            </form>
            <div class="location" id="location">
                <h3>Where am I located?</h3>
                <iframe
                width="500"
                height="300" 
                src="https://www.google.com/maps/embed/v1/place?key=AIzaSyAZhccNpRzsKWEbPv2RkcfH0UWTz-z12Es&q=San+Pedro,California" 
                frameborder="0"
                allowfullscreen>
            </iframe>
            </div>

        </main>
</body>
</html>
