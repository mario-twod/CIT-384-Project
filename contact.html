            <!--<h1 class="websitename">Mario Aguilar</h1>-->
            
            <div class="SecondHeader">
                <p class = "FirstSentence">Would you like to<br><b> Contact Me?</b></br> </p>

            </div>  

            <main>
                <p class = "disclaimer">If you would like to send an email without filling out the form, please click the button below
                </p>
                <form class= "Form">
                    <div class = "email">

                        <p><a href="mailto:mario.aguilar.270@my.csun.edu"><b>Email Me Here</b></a></p>
                    </div>
                    <h2>Contact Form</h2>
                    <div>
                        <label for="name">First Name:</label>
                        <input 
                        type="text" 
                        id="name" 
                        placeholder="Enter First Name"
                        name="first-name"
                        minlength="3"
                        maxlength="10"
                        required
                        autofocus
                        />
                    </div>
                    
                    <div>
                        <label for="name">Last Name:</label>
                        <input 
                        type="text" 
                        id="name" 
                        placeholder="Enter Last Name"
                        name="last-name"
                        minlength="3"
                        maxlength="10"
                        required/>
                    </div>
                    
                    <div>
                        <label for="number">Phone Number:</label>
                        <input 
                        type="number" 
                        id="number" 
                        placeholder="xxx-xxx-xxxx"
                        name="phone-number"
                        required/>
                    </div>
                    
                    <div>
                        <label for="email">Email Address:</label>
                        <input 
                        type="email" 
                        id="email" 
                        placeholder="example@example.com"
                        name="email"
                        required/>
                    </div>
                    
                    <div>
                        <label for="text">Subject:</label>
                        <input 
                        type="text" 
                        id="name" 
                        placeholder="ex. Job Opportunity"
                        name="subject"
                        minlength="3"
                        maxlength="25"
                        required/>
                    </div>
                    
                    <div>
                        <label for="message">Message:</label>
                        <textarea 
                        id="message" 
                        name="message"
                        placeholder="Type Message"
                        rows="4"
                        cols="40"
                        required>
                        </textarea>
                    </div>
                    
                    <div>
                        <label for="range">Priority of Message:</label>
                        <input 
                        type="range" 
                        name="priority" 
                        id="priority"
                        list="priorityTicks"
                        min="0"
                        max="2">
                        <datalist id="priorityTicks">
                            <option value="0"></option>
                            <option value="1"></option>
                            <option value="2"></option>
                        </datalist>
                    </div>
                    <button class="submit" id="submitbtn">Submit</button>
                </form>



                <div class="location" id="location">
                    <p class="mapHeading">Where am I located? <br><span class ="second">I am located in San Pedro, CA!</span></br></p>
                    <p class = "googleMap">
                        <iframe
                        class = "SanPedroMap"
                        width ="500"
                        height="300" 
                        src="https://www.google.com/maps/embed/v1/place?key=AIzaSyAZhccNpRzsKWEbPv2RkcfH0UWTz-z12Es&q=San+Pedro,California" 
                        frameborder="0"
                        allowfullscreen>
                        </iframe>
                    </p>
                </div>

            </main>
